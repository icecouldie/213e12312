<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElveTrack // Adopt Me Value Terminal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --bg: #F6F2EA;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.08);
      --card-inner: #FFFFFF;
      --brand-black: #121316;
      --brand-black-hover: #26282E;
      --brand-btn-text: #FFFFFF;
      --text-main: #18191D;
      --text-muted: #797E8B;
      --win: #15803D;
      --win-bg: rgba(34, 197, 94, 0.14);
      --lose: #DC2626;
      --lose-bg: rgba(239, 68, 68, 0.14);
      --fair: #D97706;
      --fair-bg: rgba(245, 158, 11, 0.14);
    }

    [data-theme="dark"] {
      --bg: #0C0E14;
      --card-bg: rgba(20, 24, 34, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-inner: #131722;
      --brand-black: #F8FAFC;
      --brand-black-hover: #E2E8F0;
      --brand-btn-text: #0C0E14;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --win: #10B981;
      --win-bg: rgba(16, 185, 129, 0.18);
      --lose: #EF4444;
      --lose-bg: rgba(239, 68, 68, 0.18);
      --fair: #F59E0B;
      --fair-bg: rgba(245, 158, 11, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.2s, color 0.2s; }
    body { background: var(--bg); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; }
    header { max-width: 1200px; margin: 0 auto; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.6rem; font-weight: 900; letter-spacing: -0.8px; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 24px 80px; }

    .calc-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.04);
      margin-bottom: 40px;
    }

    .calc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .trade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .trade-box { background: var(--card-inner); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; text-align: center; }
    .pet-title { font-weight: 800; font-size: 1.1rem; margin: 8px 0; }
    .pet-img { width: 76px; height: 76px; object-fit: contain; }

    .btn-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
    .btn-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
    }
    .btn-pill.active { background: var(--brand-black); color: var(--brand-btn-text); }

    .value-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.25rem;
      font-weight: 800;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      display: inline-block;
      padding: 6px 16px;
      border-radius: 10px;
      margin-top: 4px;
    }

    .verdict-box {
      border-radius: 16px;
      padding: 16px 20px;
      font-weight: 900;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 28px;
    }

    .search-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: var(--card-inner);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      margin-bottom: 20px;
    }

    .pets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
    }

    .pet-card {
      background: var(--card-inner);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
    }

    .row { display: flex; justify-content: space-between; font-size: 0.82rem; font-family: 'JetBrains Mono', monospace; padding: 2px 0; }
  </style>
</head>
<body>

  <header>
    <div class="brand">ElveTrack</div>
    <div style="font-weight: 800; color: #FF5A36; font-size: 0.9rem;">Shark Values Official</div>
  </header>

  <main>
    <div class="calc-card">
      <div class="calc-header">
        <span style="font-weight: 800; font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted);">Elvebredd Calculator Clone</span>
        <span style="font-weight: 700; color: #10B981; font-size: 0.85rem;">● 100% Synced</span>
      </div>

      <div class="trade-grid">
        <div class="trade-box">
          <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 800;">YOUR OFFER</div>
          <img class="pet-img" id="left-img" src="" alt="" onerror="this.src='https://api.iconify.design/noto:paw-prints.svg'" />
          <div class="pet-title" id="left-name">Frost Dragon</div>

          <div class="btn-row">
            <button class="btn-pill" onclick="setType('left', 'reg', this)">REG</button>
            <button class="btn-pill active" onclick="setType('left', 'neon', this)">NEON</button>
            <button class="btn-pill" onclick="setType('left', 'mega', this)">MEGA</button>
          </div>
          <div class="value-display" id="left-val">612.50</div>
        </div>

        <div class="trade-box">
          <div style="font-size: 0.75rem; color: var(--text-muted); font-weight: 800;">THEIR OFFER</div>
          <img class="pet-img" id="right-img" src="" alt="" onerror="this.src='https://api.iconify.design/noto:paw-prints.svg'" />
          <div class="pet-title" id="right-name">Shadow Dragon</div>

          <div class="btn-row">
            <button class="btn-pill" onclick="setType('right', 'reg', this)">REG</button>
            <button class="btn-pill active" onclick="setType('right', 'neon', this)">NEON</button>
            <button class="btn-pill" onclick="setType('right', 'mega', this)">MEGA</button>
          </div>
          <div class="value-display" id="right-val">2022.00</div>
        </div>
      </div>

      <div class="verdict-box" id="verdict-box">
        <span id="verdict-text">WIN (+1409.50)</span>
        <span id="verdict-spread">+230%</span>
      </div>
    </div>

    <div class="search-box">
      <h2 style="font-size: 1.4rem; font-weight: 900; margin-bottom: 12px;">Каталог питомцев</h2>
      <input type="text" class="search-input" id="search" placeholder="Поиск питомца..." oninput="filterGrid()">
      <div class="pets-grid" id="petsGrid"></div>
    </div>
  </main>

  <script>
    let PETS_DATABASE = [];

    const state = {
      left: { pet: "Frost Dragon", type: "neon" },
      right: { pet: "Shadow Dragon", type: "neon" }
    };

    function setType(side, type, btn) {
      state[side].type = type;
      btn.parentElement.querySelectorAll('.btn-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calc();
    }

    function getVal(petName, type) {
      const p = PETS_DATABASE.find(x => x.name === petName);
      if (!p) return 0;
      return parseFloat(p[`shark_${type}`] || 0);
    }

    function calc() {
      const lVal = getVal(state.left.pet, state.left.type);
      const rVal = getVal(state.right.pet, state.right.type);

      const lPet = PETS_DATABASE.find(p => p.name === state.left.pet) || { image: '' };
      const rPet = PETS_DATABASE.find(p => p.name === state.right.pet) || { image: '' };

      document.getElementById('left-name').textContent = state.left.pet;
      document.getElementById('left-img').src = lPet.image;
      document.getElementById('left-val').textContent = lVal.toFixed(1);

      document.getElementById('right-name').textContent = state.right.pet;
      document.getElementById('right-img').src = rPet.image;
      document.getElementById('right-val').textContent = rVal.toFixed(1);

      const diff = rVal - lVal;
      const box = document.getElementById('verdict-box');
      const txt = document.getElementById('verdict-text');
      const spread = document.getElementById('verdict-spread');

      const percent = Math.round((diff / (lVal || 1)) * 100);

      if (diff > 0.5) {
        box.style.background = "var(--win-bg)"; box.style.color = "var(--win)";
        txt.textContent = `WIN (+${diff.toFixed(1)})`; spread.textContent = `+${percent}%`;
      } else if (diff < -0.5) {
        box.style.background = "var(--lose-bg)"; box.style.color = "var(--lose)";
        txt.textContent = `LOSE (${diff.toFixed(1)})`; spread.textContent = `${percent}%`;
      } else {
        box.style.background = "var(--fair-bg)"; box.style.color = "var(--fair)";
        txt.textContent = `FAIR TRADE`; spread.textContent = `0%`;
      }
    }

    function renderGrid(list) {
      const grid = document.getElementById('petsGrid');
      grid.innerHTML = '';
      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'pet-card';
        card.innerHTML = `
          <img style="width: 54px; height: 54px; object-fit: contain; margin-bottom: 6px;" src="${p.image}" onerror="this.src='https://api.iconify.design/noto:paw-prints.svg'"/>
          <div style="font-weight: 800; font-size: 0.95rem; margin-bottom: 4px;">${p.name}</div>
          <div class="row"><span>Regular:</span> <b>${(p.shark_reg || 0).toFixed(1)}</b></div>
          <div class="row"><span>Neon:</span> <b>${(p.shark_neon || 0).toFixed(1)}</b></div>
          <div class="row"><span>Mega:</span> <b>${(p.shark_mega || 0).toFixed(1)}</b></div>
        `;
        card.onclick = () => {
          state.right.pet = p.name;
          calc();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        grid.appendChild(card);
      });
    }

    function filterGrid() {
      const q = document.getElementById('search').value.toLowerCase();
      renderGrid(PETS_DATABASE.filter(p => p.name.toLowerCase().includes(q)));
    }

    fetch('./pets-data.json?v=' + Date.now())
      .then(r => r.json())
      .then(data => {
        PETS_DATABASE = data;
        renderGrid(data);
        calc();
      });
  </script>
</body>
</html>
