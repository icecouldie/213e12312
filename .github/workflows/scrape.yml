name: Auto Scrape Pet Values

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  run-parser:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      - name: Настраиваем Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Устанавливаем зависимости
        run: npm install

      - name: Запускаем парсер
        run: node parser.js

      - name: Автоматический коммит обновленного файла pets-data.json
        run: |
          git config --global user.name "ElveTrack Scraper Bot"
          git config --global user.email "bot@actions.github.com"
          git add pets-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Авто-обновление базы цен питомцев [skip ci]" && git push)
